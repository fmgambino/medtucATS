<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ATS MEDTUC - Sensores</title>
  <link rel="stylesheet" href="/data/styles.css">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <div class="header-container">
      <img id="logo" src="https://www.educaciontuc.gov.ar/wp-content/uploads/2024/10/MINISTERIO-DE-EDUCACION_Mesa-de-trabajo-1-2.png" alt="Logo ATS" />
      <h1>ATS MEDTUC</h1>
      
      <button id="theme-toggle">🌙</button>
    </div>
  </header>

  <main>
    <div class="sensor">
      <iframe src="https://api.wo-cloud.com/content/widget/?geoObjectKey=8684233&language=es&region=AR&timeFormat=HH:mm&windUnit=kmh&systemOfMeasurement=metric&temperatureUnit=celsius" name="CW2" scrolling="no" width="190" height="318" frameborder="0" style="border: 1px solid #10658E;border-radius: 8px"></iframe>
    </div>
    
    <div class="sensor">
      <h2>🌡️ Temperatura</h2>
      <p id="temp">-- °C</p>
    </div>

    <div class="sensor">
      <h2>💧 Humedad</h2>
      <p id="hum">-- %</p>
    </div>

    <div class="sensor">
      <h2>🫧 Calidad Aire</h2>
      <p id="air">-- ppm</p>
    </div>

    <div class="sensor">
      <h2>⛽ Nafta</h2>
      <p id="fuel">-- %</p>
    </div>

    <div class="sensor">
      <h2>⚡ Grupo Electrógeno</h2>
      <p id="gen">--</p>
    </div>
  </main>

  <footer>
    <p>👨‍💻 Dev. for Ing. Gambino</p>
  </footer>

  <script src="/data/script.js"></script>
  <script src="/script.js"></script>
  <script src="script.js"></script>
</body>
</html>
